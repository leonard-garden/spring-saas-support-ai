name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL with pgvector
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=supportsaas \
            -e POSTGRES_USER=supportsaas \
            -e POSTGRES_PASSWORD=supportsaas \
            -p 5432:5432 \
            pgvector/pgvector:pg16

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U supportsaas && break
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          docker exec postgres pg_isready -U supportsaas

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests

      - name: Run tests (including TenantIsolationIT)
        run: mvn verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
