spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/supportsaas
    username: supportsaas
    password: supportsaas
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

minio:
  init-on-startup: false

app:
  base-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
