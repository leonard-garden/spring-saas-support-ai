spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dev-placeholder}
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-3-small
  datasource:
    url: jdbc:postgresql://localhost:5432/supportsaas
    username: supportsaas
    password: supportsaas
    hikari:
      maximum-pool-size: 22
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  base-url: http://localhost:8081
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,null

logging:
  level:
    com.leonardtrinh.supportsaas: DEBUG
    org.springframework.security: DEBUG
